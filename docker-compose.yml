services:
  sttmountain:
    image: ghcr.io/syoslyot/sttmountain:latest
    build: .
    restart: unless-stopped
    volumes:
      - sttdata:/data
    environment:
      - ENV=prod

  sttmountaincrazy:
    image: ghcr.io/syoslyot/sttmountaincrazy:latest
    restart: unless-stopped
    volumes:
      - sttdata:/app/data:ro
    environment:
      - DB_PATH=/app/data/db/sttmountain.db
      - STATIC_BASE=/app/data/static
    depends_on:
      sttmountain:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sttmountain
      - sttmountaincrazy

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup

volumes:
  sttdata:
