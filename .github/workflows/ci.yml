name: CI - Data Sync

on:
  schedule:
    - cron: '0 20 * * *'   # 每天 UTC 20:00（台灣時間凌晨 4:00）
  workflow_dispatch:        # 手動觸發
  pull_request:
    branches: [main]

jobs:
  # PR 驗證：確認 Python 語法正確
  import-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python import check
        env:
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_ANON_KEY: "placeholder"
        run: python -c "from app.main import app; print('Import OK')"

  # 資料同步：每日排程 or 手動觸發
  sync-and-normalize:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install LibreOffice + CJK fonts
        run: sudo apt-get install -y libreoffice fonts-noto-cjk

      - name: Sync from Google Drive
        env:
          GDRIVE_CREDENTIALS_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
        run: python3 scripts/sync_drive.py

      - name: Normalize and upload to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/normalize.py
