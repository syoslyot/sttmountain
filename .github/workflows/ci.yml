name: CI - Sync, Build, Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/syoslyot/sttmountain

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Drive credentials
        id: drive-check
        run: |
          if [ -n "$GDRIVE_CREDENTIALS_JSON" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi
        env:
          GDRIVE_CREDENTIALS_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}

      - name: Sync from Google Drive
        if: steps.drive-check.outputs.available == 'true'
        env:
          GDRIVE_CREDENTIALS_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
        run: python3 scripts/sync_drive.py

      - name: Install LibreOffice
        if: steps.drive-check.outputs.available == 'true'
        run: sudo apt-get install -y libreoffice

      - name: Normalize Excel to SQLite
        if: steps.drive-check.outputs.available == 'true'
        run: python3 scripts/normalize.py

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

      - name: Trigger sttmountaincrazy rebuild
        run: |
          [ -n "$GH_PAT" ] && curl -s -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/syoslyot/sttmountaincrazy/actions/workflows/ci.yml/dispatches \
            -d '{"ref":"main"}' || true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
