name: CI - Data Sync

on:
  schedule:
    - cron: '0 13 * * *'   # 每天 UTC 13:00（台灣時間 21:00）
  workflow_dispatch:        # 手動觸發
    inputs:
      target_db:
        description: '目標資料庫（dev / prod）'
        required: false
        default: 'prod'
        type: choice
        options:
          - prod
          - dev
  push:
    branches: [main]       # push main 時 build image
  pull_request:
    branches: [main]

jobs:
  # PR 驗證：確認 Python 語法正確
  import-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python import check
        env:
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_ANON_KEY: "placeholder"
        run: python -c "from app.main import app; print('Import OK')"

  # 資料同步：每日排程 or 手動觸發
  sync-and-normalize:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install LibreOffice + CJK fonts
        run: sudo apt-get install -y libreoffice fonts-noto-cjk

      - name: Sync from Google Drive
        env:
          GDRIVE_CREDENTIALS_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
          SUPABASE_URL: ${{ (github.event_name == 'schedule' || inputs.target_db == 'dev') && secrets.SUPABASE_URL_DEV || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ (github.event_name == 'schedule' || inputs.target_db == 'dev') && secrets.SUPABASE_SERVICE_KEY_DEV || secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/sync_drive.py

      - name: Normalize and upload to Supabase
        env:
          SUPABASE_URL: ${{ (github.event_name == 'schedule' || inputs.target_db == 'dev') && secrets.SUPABASE_URL_DEV || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ (github.event_name == 'schedule' || inputs.target_db == 'dev') && secrets.SUPABASE_SERVICE_KEY_DEV || secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/normalize.py

  # Docker image build + push to GHCR
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: []
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sttmountain:latest
